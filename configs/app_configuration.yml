# Configuration specific to WhatsApp
whatsapp:
  url_pattern: '(https?://\S+)'
  weeks: {
            0: 'Monday',
            1: 'Tuesday',
            2: 'Wednesday',
            3: 'Thrusday',
            4: 'Friday',
            5: 'Saturday',
            6: 'Sunday'
        }
  regex_list: [
            '(\d+\-\d+\-\d+, \d+:\d+ [a-zA-Z].[a-zA-Z].*) - (.*?): (.*)',
            '(\d+/\d+/\d+, \d+:\d+\d+ [a-zA-Z]*) - (.*?): (.*)',
            '(\[\d+/\d+/\d+, \d+:\d+:\d+ [A-Z][A-Z]\]) (.*?): (.*)',
            '(\d+/\d+/\d+, \d+:\d+ [a-zA-Z][a-zA-Z]) - (.*?): (.*)'
        ]
  ignore: [
            'Missed video call', 'Missed group video call',
            'Missed voice call', '<Media omitted>',
            'This message was deleted', 'image omitted',
            'video omitted', 'You deleted this message',
            'sticker omitted']

# Comprehensive Logging configuration
logging:
  version: 1
  disable_existing_loggers: false
  formatters:
    detailed:
      format: "%(asctime)s [%(levelname)s] [%(name)s:%(funcName)s:%(lineno)d] - %(message)s"
      datefmt: "%Y-%m-%d %H:%M:%S"
    simple:
      format: "WhatsApp Processor - %(asctime)s - %(levelname)s - %(message)s"
  handlers:
    console:
      class: logging.StreamHandler
      formatter: detailed
      level: DEBUG
    file:
      class: logging.handlers.RotatingFileHandler
      filename: "latest_logs/app.log"
      maxBytes: 5242880 # 5MB
      backupCount: 5
      formatter: detailed
      level: DEBUG
      encoding: "utf-8"
  root:
    level: DEBUG
    handlers: [ console, file ]